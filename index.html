<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      text-align: center;
      font-family: 'Mitr', sans-serif;
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    .heart-bg {
      position: absolute;
      font-size: 28px;
      opacity: 0.35;
      animation: float 5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(12deg); }
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 40px 20px;
      border-radius: 35px;
      box-shadow: 0 20px 45px rgba(238, 156, 167, 0.45);
      border: 4px solid #ffffff;
      width: 100%;
      max-width: 340px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ff3366;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 25px;
      -webkit-text-stroke: 1.2px #ffffff;
      text-shadow: 0px 4px 10px rgba(255, 51, 102, 0.2);
    }

    .btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    button {
      padding: 12px 22px;
      font-size: 18px;
      font-family: 'Mitr', sans-serif;
      font-weight: 600;
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      outline: none;
      touch-action: manipulation;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    #yesBtn:active {
      transform: scale(0.92);
    }

    #noBtn {
      background: linear-gradient(135deg, #d8b4fe, #c084fc);
      color: #3b0764;
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    }

    #noBtn:active {
      transform: scale(0.92);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 320px;
      width: 100%;
      border: 4px solid #ffccd5;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      color: #ff3366;
      margin-bottom: 15px;
      font-size: 22px;
      line-height: 1.4;
    }

    .close-btn {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      font-family: 'Mitr', sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin-top: 10px;
    }

    /* ฉากจบ แบร่😋 ตัวใหญ่ตรงกลาง */
    #finalScreen {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: popIn 0.5s ease-out;
    }

    #finalText {
      color: #ff3366;
      font-size: 64px;
      font-weight: 700;
      text-shadow: 0px 8px 20px rgba(255, 51, 102, 0.3);
      -webkit-text-stroke: 2px #ffffff;
    }
  </style>
</head>
<body>

  <div class="heart-bg" style="top: 8%; left: 10%;">💖</div>
  <div class="heart-bg" style="top: 15%; right: 12%; animation-delay: 1s;">✨</div>
  <div class="heart-bg" style="top: 75%; left: 8%; animation-delay: 2s;">🌸</div>
  <div class="heart-bg" style="top: 82%; right: 10%; animation-delay: 1.5s;">💕</div>

  <div class="card" id="mainCard">
    <h1>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</h1>
    
    <div class="btn-container">
      <button id="yesBtn" onclick="clickYes()">อยากคุย 💕</button>
      <button id="noBtn" onclick="handleNoClick()">ไม่อยากคุย 🥺</button>
    </div>
  </div>

  <div class="modal" id="myModal">
    <div class="modal-content">
      <h2 id="modalTitle">ข้อความ 💌</h2>
      <button class="close-btn" onclick="closeModal()">ตกลง 💖</button>
    </div>
  </div>

  <!-- ฉากจบ -->
  <div id="finalScreen">
    <div id="finalText">แบร่😋</div>
  </div>

  <script>
    let clickCount = 0;
    let isFinished = false;

    function handleNoClick() {
      clickCount++;

      if (clickCount === 1) {
        showModal("พี่ไม่อยากคุยกับเค้าจริงเหรออออ🥺");
      } else if (clickCount === 2) {
        showModal("น๊าาา มาคุยกัน เค้าอยากคุยกับพี่น้าาาาาาา🤗💓");
      } else if (clickCount >= 3) {
        showModal("พี่ไม่มีสิทธิ์ปฏิเสธ ไอโง๊วเอ๊ย🥰");
      }
    }

    function clickYes() {
      isFinished = true;
      showModal("น่ารักที่สุดเลยไอต้าวววววว 🥰✨ มาโทรกันเต๊อะ💕💕💕");
    }

    function showModal(title) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('myModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('myModal').style.display = 'none';

      // พอกดปิดข้อความครั้งที่ 3 แล้ว ปุ่มสีม่วงจะซ่อนไป
      if (clickCount >= 3) {
        const noBtn = document.getElementById('noBtn');
        if (noBtn) {
          noBtn.style.display = 'none';
        }
      }

      // ถ้ากดปุ่ม "อยากคุย" แล้วปิดป๊อปอัพ จะเข้าฉากจบ "แบร่😋"
      if (isFinished) {
        document.getElementById('mainCard').style.display = 'none';
        document.getElementById('finalScreen').style.display = 'flex';
      }
    }
  </script>

</body>
</html>
