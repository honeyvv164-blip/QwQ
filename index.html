<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      text-align: center;
      font-family: 'Mitr', sans-serif;
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 35px 20px;
      border-radius: 35px;
      box-shadow: 0 20px 45px rgba(238, 156, 167, 0.45);
      border: 4px solid #ffffff;
      width: 100%;
      max-width: 340px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ff3366;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 25px;
      -webkit-text-stroke: 1.2px #ffffff;
      text-shadow: 0px 4px 10px rgba(255, 51, 102, 0.2);
    }

    .btn-container {
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    button {
      padding: 12px 22px;
      font-size: 18px;
      font-family: 'Mitr', sans-serif;
      font-weight: 600;
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      outline: none;
      touch-action: manipulation;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
    }

    #yesBtn:active {
      transform: scale(0.92);
    }

    /* ปุ่มม่วง ไม่อยากคุย */
    #noBtn {
      background: linear-gradient(135deg, #d8b4fe, #c084fc);
      color: #3b0764;
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
      z-index: 99;
      transition: all 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 320px;
      width: 100%;
      border: 4px solid #ffccd5;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      color: #ff3366;
      margin-bottom: 15px;
      font-size: 24px;
      -webkit-text-stroke: 0.5px #ffffff;
    }

    .modal-content p {
      color: #4a4e69;
      font-size: 18px;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .close-btn {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      font-family: 'Mitr', sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</h1>
    
    <div class="btn-container">
      <button id="yesBtn" onclick="clickYes()">อยากคุย 💕</button>
      <button id="noBtn" onclick="moveButton()" ontouchstart="moveButton(event)">ไม่อยากคุย 🥺</button>
    </div>
  </div>

  <div class="modal" id="myModal">
    <div class="modal-content">
      <h2 id="modalTitle">ข้อความ 💌</h2>
      <p id="modalText">เนื้อหาข้อความ...</p>
      <button class="close-btn" onclick="closeModal()">ตกลง 💖</button>
    </div>
  </div>

  <script>
    let escapeCount = 0;
    const maxEscapes = 10;

    function moveButton(e) {
      if (e) e.preventDefault();
      
      const noBtn = document.getElementById('noBtn');

      if (escapeCount < maxEscapes) {
        escapeCount++;

        noBtn.style.position = 'fixed';

        // คำนวณระยะขอบจอโดยเผื่อความกว้าง/สูงของปุ่ม + Padding เพื่อไม่ให้หลุดขอบจอเด็ดขาด
        const padding = 25; // ระยะเว้นจากขอบจอ
        const btnWidth = noBtn.offsetWidth || 130;
        const btnHeight = noBtn.offsetHeight || 50;

        const minX = padding;
        const maxX = window.innerWidth - btnWidth - padding;
        
        const minY = padding;
        const maxY = window.innerHeight - btnHeight - padding;

        // สุ่มพิกัดบนพื้นหลังสีชมพูในขอบเขตหน้าจอที่มองเห็นแน่นอน
        const randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
        const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';

        if (escapeCount === maxEscapes) {
          setTimeout(() => {
            showModal("เค้างอนแล้ว 😠", "เธอต้องง้อ 😠🔥");
          }, 250);
        }
      } else {
        showModal("เค้างอนแล้ว 😠", "เธอต้องง้อ 😠🔥");
      }
    }

    function clickYes() {
      showModal("น่ารักที่สุดเลยไอต้าวววววว 🥰✨", "มาโทรกันเต๊อะ💕💕💕");
    }

    function showModal(title, text) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalText').innerText = text;
      document.getElementById('myModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('myModal').style.display = 'none';
    }
  </script>

</body>
</html>
