<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      text-align: center;
      font-family: 'Mitr', sans-serif;
      background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .heart-bg {
      position: absolute;
      font-size: 28px;
      opacity: 0.35;
      animation: float 5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(12deg); }
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 45px 20px;
      border-radius: 35px;
      box-shadow: 0 20px 45px rgba(238, 156, 167, 0.45);
      border: 4px solid #ffffff;
      width: 100%;
      max-width: 360px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ff3366;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 20px;
      -webkit-text-stroke: 1.5px #ffffff;
      text-shadow: 0px 4px 10px rgba(255, 51, 102, 0.25);
    }

    /* พื้นที่สำหรับปุ่ม ให้ปุ่มวิ่งวนเล่นได้เฉพาะในกล่องนี้ */
    .btn-area {
      position: relative;
      width: 100%;
      height: 180px; 
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      font-family: 'Mitr', sans-serif;
      font-weight: 600;
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      outline: none;
      touch-action: manipulation;
      position: absolute;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
      left: 15px;
      top: 65px;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    #yesBtn:active {
      transform: scale(0.92);
    }

    /* ปุ่มไม่อยากคุย - ย้ายแค่ภายใน .btn-area */
    #noBtn {
      background: linear-gradient(135deg, #d8b4fe, #c084fc);
      color: #3b0764;
      text-shadow: 0 1px 2px rgba(255,255,255,0.5);
      right: 15px;
      top: 65px;
      z-index: 3;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 340px;
      width: 100%;
      border: 4px solid #ffccd5;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-content h2 {
      color: #ff3366;
      margin-bottom: 15px;
      font-size: 24px;
      -webkit-text-stroke: 0.5px #ffffff;
    }

    .modal-content p {
      color: #4a4e69;
      font-size: 18px;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .close-btn {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      font-family: 'Mitr', sans-serif;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="heart-bg" style="top: 8%; left: 10%;">💖</div>
  <div class="heart-bg" style="top: 15%; right: 12%; animation-delay: 1s;">✨</div>
  <div class="heart-bg" style="top: 75%; left: 8%; animation-delay: 2s;">🌸</div>
  <div class="heart-bg" style="top: 82%; right: 10%; animation-delay: 1.5s;">💕</div>

  <div class="card">
    <h1>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</h1>
    
    <div class="btn-area" id="btnArea">
      <button id="yesBtn" onclick="clickYes()">อยากคุย 💕</button>
      <button id="noBtn" onclick="moveButton()" ontouchstart="moveButton(event)">ไม่อยากคุย 🥺</button>
    </div>
  </div>

  <div class="modal" id="myModal">
    <div class="modal-content">
      <h2 id="modalTitle">ข้อความ 💌</h2>
      <p id="modalText">เนื้อหาข้อความ...</p>
      <button class="close-btn" onclick="closeModal()">ตกลง 💖</button>
    </div>
  </div>

  <script>
    let escapeCount = 0;
    const maxEscapes = 10;

    function moveButton(e) {
      if (e) e.preventDefault();
      
      const noBtn = document.getElementById('noBtn');
      const area = document.getElementById('btnArea');

      if (escapeCount < maxEscapes) {
        escapeCount++;

        // คำนวณขอบเขตให้อยู่เฉพาะในการ์ด
        const maxX = area.clientWidth - noBtn.clientWidth;
        const maxY = area.clientHeight - noBtn.clientHeight;

        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY);

        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';

        if (escapeCount === maxEscapes) {
          setTimeout(() => {
            showModal("เค้างอนแล้ว 😠", "เธอต้องง้อ 😠🔥");
          }, 250);
        }
      } else {
        showModal("เค้างอนแล้ว 😠", "เธอต้องง้อ 😠🔥");
      }
    }

    function clickYes() {
      showModal("น่ารักที่สุดเลยไอต้าวววววว 🥰✨", "มาโทรกันเต๊อะ💕💕💕");
    }

    function showModal(title, text) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalText').innerText = text;
      document.getElementById('myModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('myModal').style.display = 'none';
    }
  </script>

</body>
</html>
