<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ถามจริงงงง 🥺</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap');

    body {
      text-align: center;
      font-family: 'Mitr', sans-serif;
      background-color: #fff0f3; /* สีชมพูนมละมุน */
      margin: 0;
      padding-top: 80px;
      overflow: hidden;
    }

    h1 {
      color: #ff758f;
      font-size: 28px;
      margin-bottom: 40px;
      text-shadow: 2px 2px 0px #ffffff;
    }

    .btn-container {
      position: relative;
      height: 300px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      font-family: 'Mitr', sans-serif;
      border: 3px solid #ffffff;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 143, 0.2);
      transition: all 0.2s ease;
    }

    /* ปุ่มอยากคุย - สีพาสเทลเขียวมิ้นต์/ชมพู */
    #yesBtn {
      background-color: #ffb3c1;
      color: #7209b7;
      position: absolute;
      left: 30%;
      top: 20px;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background-color: #ff8fa3;
    }

    /* ปุ่มไม่อยากคุย - สีพาสเทลฟ้า/เทาน่ารัก */
    #noBtn {
      background-color: #c8b6ff;
      color: #4a4e69;
      position: absolute;
      left: 55%;
      top: 20px;
      transition: 0.1s ease-out; /* ย้ายหนีนุ่มๆ */
    }
  </style>
</head>
<body>

  <h1>พี่อยากคุยกับเค้ามั้ยยยย 🥺💖</h1>
  
  <div class="btn-container">
    <button id="yesBtn" onclick="alert('งั้นก็ทักมาดิครับ รอไรอยู่! 🥰✨')">อยากคุย 💕</button>
    <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">ไม่อยากคุย 🥺</button>
  </div>

  <script>
    function moveButton() {
      // คำนวณขอบเขตหน้าจอไม่ให้ปุ่มเด้งหลุดจอ
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 100);
      const noBtn = document.getElementById('noBtn');
      
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }
  </script>

</body>
</html>
